services:
    geoip:
        container_name: geoip-2025
        build: .
        restart: always
        ports:
            # 建议只在本机监听，再用 nginx / Cloudflare Tunnel 加 HTTPS 暴露给 Worker
            - 127.0.0.1:8090:8090
        volumes:
            # 启动时自动从 GitHub 下载 GeoLite2-Country / GeoLite2-City 到这里，并按 GEOIP_UPDATE_HOURS 刷新
            - geoip-data:/data
        environment:
            - TZ=Asia/Shanghai
            - GEOIP_LOCALE=zh-CN
            # 可选：查询接口的访问口令（任意字符串），设置后 Worker 的 GEOIP_API_TOKEN 填同一值；留空则不鉴权
            # - GEOIP_TOKEN=
            # 下载地址模板，{edition} 会被替换为库名；默认 du5/geoip 镜像，无需 MaxMind 账号
            # - GEOIP_SOURCE_URL=https://github.com/du5/geoip/blob/main/{edition}.mmdb?raw=1
            # 自动刷新间隔（小时），0 表示只在缺文件时下载
            - GEOIP_UPDATE_HOURS=24

volumes:
    geoip-data:
